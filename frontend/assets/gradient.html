<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradient Background</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #130b3d;
      }

      body {
        position: relative;
      }

      .gradient-stage {
        position: absolute;
        inset: -12%;
        background:
          radial-gradient(circle at 18% 20%, rgba(65, 105, 225, 0.95), transparent 34%),
          radial-gradient(circle at 82% 28%, rgba(255, 82, 121, 0.88), transparent 30%),
          radial-gradient(circle at 50% 78%, rgba(0, 20, 168, 0.82), transparent 28%),
          linear-gradient(135deg, #08165d 0%, #2a1668 38%, #6d1748 100%);
        filter: saturate(120%);
        animation: drift 14s ease-in-out infinite alternate;
      }

      .gradient-stage::before,
      .gradient-stage::after {
        content: "";
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
      }

      .gradient-stage::before {
        background:
          radial-gradient(circle at 30% 70%, rgba(95, 143, 255, 0.55), transparent 22%),
          radial-gradient(circle at 72% 62%, rgba(255, 92, 132, 0.46), transparent 20%);
        animation: pulse 12s ease-in-out infinite;
      }

      .gradient-stage::after {
        background:
          linear-gradient(120deg, rgba(255, 255, 255, 0.05), transparent 30%),
          linear-gradient(300deg, rgba(255, 255, 255, 0.04), transparent 35%);
        opacity: 0.7;
        animation: shimmer 16s linear infinite;
      }

      @keyframes drift {
        0% {
          transform: translate3d(-2%, -1%, 0) scale(1.05) rotate(0deg);
        }

        50% {
          transform: translate3d(2%, 2%, 0) scale(1.12) rotate(6deg);
        }

        100% {
          transform: translate3d(-1%, 3%, 0) scale(1.08) rotate(-5deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.75;
        }

        50% {
          transform: scale(1.16);
          opacity: 1;
        }
      }

      @keyframes shimmer {
        from {
          transform: translateX(-8%);
        }

        to {
          transform: translateX(8%);
        }
      }
    </style>
  </head>
  <body>
    <div class="gradient-stage"></div>
  </body>
</html>
