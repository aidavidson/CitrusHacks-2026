<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
    <div class="gradient-container">
       <iframe src="https://shadergradient.co/customize?animate=on&axesHelper=off&brightness=1.2&cAzimuthAngle=180&cDistance=3.6&cPolarAngle=90&cameraZoom=1&color1=%230381ff&color2=%230b99db&color3=%239b05e1&destination=onCanvas&embedMode=off&envPreset=city&format=gif&fov=45&frameRate=10&gizmoHelper=hide&grain=on&lightType=3d&pixelDensity=1&positionX=-1.4&positionY=0&positionZ=0&range=disabled&rangeEnd=40&rangeStart=0&reflection=0.1&rotationX=0&rotationY=10&rotationZ=50&shader=defaults&type=plane&uAmplitude=1&uDensity=1.3&uFrequency=5.5&uSpeed=0.4&uStrength=4&uTime=0&wireframe=false" style="width:100%; height:100vh; border:none;"></iframe>
    </div>
  -->
    <div class="background-glow background-glow-left"></div>
    <div class="background-glow background-glow-right"></div>

    <main class="page-shell">
      <section class="hero-card">
        <div class="hero-copy">
          <p class="eyebrow">Personal music dashboard</p>
          <h1>Track your Spotify in one simple place.</h1>
          <p class="hero-text">
            See your recent listens, top artists, and weekly listening habits
            with a clean dashboard layout.
          </p>

          <div class="hero-actions">
            <button class="primary-button">Connect Spotify</button>
            <button class="secondary-button">View Demo Stats</button>
          </div>

          <div class="stat-strip">
            <article>
              <span class="stat-number">67</span>
              <span class="stat-label">Songs Played</span>
            </article>
            <article>
              <span class="stat-number">18</span>
              <span class="stat-label">Songs Skipped</span>
            </article>
          </div>
        </div>

        <aside class="now-playing-card">
          <div class="now-playing-cover"></div>
          <div class="now-playing-meta">
            <p class="mini-label">Now playing</p>
            <h2>Midnight City</h2>
            <p>M83</p>
          </div>
          <div class="progress-block">
            <div class="progress-line">
              <span></span>
            </div>
            <div class="progress-time">
              <span>1:42</span>
              <span>4:03</span>
            </div>
          </div>
        </aside>
      </section>

      <section class="dashboard-grid">
        <article class="panel">
          <div class="panel-heading">
            <h3>Least Skipped Songs</h3>
          </div>
          <div class="track-list" id="recent-tracks"></div>
        </article>

        <article class="panel accent-panel">
          <div class="panel-heading">
            <h3>Most Skipped Songs</h3>
          </div>
          <div class="artist-list" id="top-artists"></div>
        </article>

        <article class="panel wide-panel clean-panel">
          <button class="primary-button clean-button">Clean</button>
        </article>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
