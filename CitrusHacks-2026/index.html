<!DOCTYPE html>
<html lang="en">
 <head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Sortify</title>
   <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
   <link
     href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
     rel="stylesheet"
   />
   <link rel="stylesheet" href="style.css" />
	 </head>
	 <body>
	   <div
	     id="rate-limit-warning"
	     style="display: none; position: fixed; top: 16px; right: 16px; z-index: 9999; max-width: 320px; padding: 12px 14px; border: 1px solid rgba(255, 133, 133, 0.55); border-radius: 12px; background: rgba(61, 10, 18, 0.94); color: #ffe4e6; font-size: 12px; line-height: 1.45; box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);"
	   ></div>
	   <div class="gradient-container">
	     <div class="gradient-orb gradient-orb-blue"></div>
     <div class="gradient-orb gradient-orb-red"></div>
     <div class="gradient-orb gradient-orb-indigo"></div>
     <div class="gradient-wave gradient-wave-one"></div>
     <div class="gradient-wave gradient-wave-two"></div>
     <div class="gradient-mesh"></div>
   </div>
   <div class="background-glow background-glow-left"></div>
   <div class="background-glow background-glow-right"></div>


   <main class="page-shell">
     <section class="hero-card landing-page" id="landing-page">
       <div class="hero-copy">
         <p class="eyebrow">Personal music dashboard</p>
         <h1>Clean up Your Playlists.</h1>
         <p class="hero-text">
           find songs you may not want to listen to anymore and encourage musical growth.
         </p>


         <div class="hero-actions">
           <button class="primary-button" id="login-button">Connect Your Spotify</button>
           <button class="secondary-button" id="check-skipped-button">Check Skipped</button>
         </div>
         <div class="client-config">
           <label class="client-config-label" for="spotify-client-id">
             Spotify Client ID
           </label>
           <div class="client-config-row">
             <input
               class="client-config-input"
               id="spotify-client-id"
               name="spotify-client-id"
               type="text"
               placeholder="Paste your Spotify Client ID"
               autocomplete="off"
               spellcheck="false"
             />
             <button class="secondary-button client-config-button" id="save-client-id-button">
               Save ID
             </button>
           </div>
         </div>
         <p class="auth-status" id="auth-status">Connect Spotify to load your listening data.</p>
       </div>
     </section>

     <section class="dashboard-page is-hidden" id="dashboard-page">
       <header class="dashboard-topbar">
         <div class="dashboard-branding">
           <h2 class="sortify-title">Sortify</h2>
           <p class="welcome-title">Welcome <span id="welcome-user-name">Spotify user</span></p>
           <img
             class="logo dashboard-hero-image"
             src="book-logo2.png"
             alt="Sortify bookshelf illustration"
           />
           <div class="dashboard-button-row">
             <button class="primary-button" id="disconnect-button">Disconnect Spotify</button>
             <button class="secondary-button" id="dashboard-check-skipped-button">Check Skipped</button>
           </div>
         </div>
       </header>

       <section class="stat-strip dashboard-stat-strip">
         <article>
           <span class="stat-number" id="songs-played-value"></span>
           <span class="stat-label" id="songs-played-label"></span>
         </article>
         <article>
           <span class="stat-number" id="songs-skipped-value"></span>
           <span class="stat-label" id="songs-skipped-label"></span>
         </article>
       </section>

       <aside class="now-playing-card dashboard-now-playing">
         <div class="now-playing-cover" id="now-playing-cover"></div>
         <div class="now-playing-meta">
           <p class="mini-label">Now playing</p>
           <h2 id="now-playing-title"></h2>
           <p id="now-playing-artist"></p>
         </div>
         <div class="progress-block">
           <div class="progress-line">
             <span id="now-playing-progress"></span>
           </div>
           <div class="progress-time">
             <span id="now-playing-current-time"></span>
             <span id="now-playing-duration"></span>
           </div>
         </div>
       </aside>

       <section class="dashboard-grid">
         <article class="panel">
           <div class="panel-heading">
             <h3>Least Skipped Songs</h3>
           </div>
           <div class="track-list" id="liked-songs"></div>
         </article>


         <article class="panel accent-panel">
           <div class="panel-heading">
             <h3>Most Skipped Songs</h3>
           </div>
           <div class="artist-list" id="skipped-songs"></div>
         </article>


         <article class="panel wide-panel clean-panel">
           <div class="clean-panel-actions">
             <button class="primary-button clean-button">Clean</button>
           </div>
         </article>
       </section>
     </section>
   </main>


   <script src="script.js"></script>
   <script src="app-config.js"></script>
   <script type="module">
     import {
       fetchCurrentUserProfile,
       handleSpotifyCallback,
       isSpotifyConnected,
       logoutSpotify,
       spotifyFetch,
       startSpotifyLogin,
     } from "../frontend/js/auth.js";


     const loginButton = document.getElementById("login-button");
     const disconnectButton = document.getElementById("disconnect-button");
     const authStatus = document.getElementById("auth-status");
     const clientIdInput = document.getElementById("spotify-client-id");
	     const saveClientIdButton = document.getElementById("save-client-id-button");
	     const nowPlayingTitle = document.getElementById("now-playing-title");
	     const nowPlayingArtist = document.getElementById("now-playing-artist");
	     const nowPlayingCover = document.getElementById("now-playing-cover");
	     const nowPlayingCurrentTime = document.getElementById("now-playing-current-time");
	     const nowPlayingDuration = document.getElementById("now-playing-duration");
	     const nowPlayingProgress = document.getElementById("now-playing-progress");
	     const rateLimitWarning = document.getElementById("rate-limit-warning");
	     let nowPlayingPollId = null;
	     let spotifyCooldownTimeoutId = null;
	     let isNowPlayingRequestInFlight = false;


     function setAuthStatus(message) {
       if (authStatus) {
         authStatus.textContent = message;
       }
     }


	     function setLoginButtonLabel(message) {
	       if (loginButton) {
	         loginButton.textContent = message;
	       }
	     }

	     function hideRateLimitWarning() {
	       if (rateLimitWarning) {
	         rateLimitWarning.style.display = "none";
	         rateLimitWarning.textContent = "";
	       }
	     }

	     function showRateLimitWarning(message) {
	       if (rateLimitWarning) {
	         rateLimitWarning.textContent = message;
	         rateLimitWarning.style.display = "block";
	       }
	     }

     function getRetryAfterSeconds(response) {
       const retryAfterHeader = Number(response.headers.get("Retry-After") ?? "30");
       return Number.isFinite(retryAfterHeader) && retryAfterHeader > 0 ? retryAfterHeader : 30;
     }

     function clearSpotifyCooldown() {
       if (spotifyCooldownTimeoutId) {
         window.clearTimeout(spotifyCooldownTimeoutId);
         spotifyCooldownTimeoutId = null;
       }
     }

	     function scheduleSpotifyCooldown(retryAfterSeconds, onResume) {
	       stopNowPlayingPolling();
	       clearSpotifyCooldown();
	       setAuthStatus(
	         `Spotify rate limit hit. Cooling down for ${retryAfterSeconds} second${retryAfterSeconds === 1 ? "" : "s"}.`
	       );
	       showRateLimitWarning(
	         `Spotify rate limit hit. Stop testing in other tabs right now.${retryAfterSeconds ? ` Cooling down for about ${retryAfterSeconds} second${retryAfterSeconds === 1 ? "" : "s"}.` : ""}`
	       );

	       spotifyCooldownTimeoutId = window.setTimeout(() => {
	         spotifyCooldownTimeoutId = null;
	         hideRateLimitWarning();
	         if (typeof onResume === "function") {
	           onResume();
	         }
	       }, retryAfterSeconds * 1000);
	     }

     function formatMs(ms) {
       if (!Number.isFinite(ms) || ms < 0) {
         return "--:--";
       }

       const totalSeconds = Math.floor(ms / 1000);
       const minutes = Math.floor(totalSeconds / 60);
       const seconds = totalSeconds % 60;
       return `${minutes}:${String(seconds).padStart(2, "0")}`;
     }

     function resetNowPlayingUi(message = "Nothing is playing right now.") {
       if (nowPlayingTitle) {
         nowPlayingTitle.textContent = "No active track";
       }

       if (nowPlayingArtist) {
         nowPlayingArtist.textContent = message;
       }

       if (nowPlayingCurrentTime) {
         nowPlayingCurrentTime.textContent = "--:--";
       }

       if (nowPlayingDuration) {
         nowPlayingDuration.textContent = "--:--";
       }

       if (nowPlayingProgress) {
         nowPlayingProgress.style.width = "0%";
       }

       if (nowPlayingCover) {
         nowPlayingCover.style.backgroundImage = `
           linear-gradient(135deg, rgba(61, 99, 255, 0.22), rgba(255, 90, 118, 0.4))
         `;
       }
     }

     function renderNowPlaying(trackData) {
       const item = trackData?.item;
       if (!item) {
         resetNowPlayingUi();
         return;
       }

       const artistName = item.artists?.[0]?.name ?? "Unknown artist";
       const coverUrl = item.album?.images?.[0]?.url ?? "";
       const progressMs = trackData.progress_ms ?? 0;
       const durationMs = item.duration_ms ?? 0;
       const percentComplete = durationMs > 0 ? (progressMs / durationMs) * 100 : 0;

       if (nowPlayingTitle) {
         nowPlayingTitle.textContent = item.name ?? "Unknown track";
       }

       if (nowPlayingArtist) {
         nowPlayingArtist.textContent = artistName;
       }

       if (nowPlayingCurrentTime) {
         nowPlayingCurrentTime.textContent = formatMs(progressMs);
       }

       if (nowPlayingDuration) {
         nowPlayingDuration.textContent = formatMs(durationMs);
       }

       if (nowPlayingProgress) {
         nowPlayingProgress.style.width = `${Math.min(Math.max(percentComplete, 0), 100)}%`;
       }

       if (nowPlayingCover) {
         nowPlayingCover.style.backgroundImage = coverUrl
           ? `
             linear-gradient(135deg, rgba(61, 99, 255, 0.18), rgba(255, 90, 118, 0.4)),
             url("${coverUrl}")
           `
           : `
             linear-gradient(135deg, rgba(61, 99, 255, 0.22), rgba(255, 90, 118, 0.4))
           `;
       }
     }

     async function loadCurrentlyPlaying() {
       if (!isSpotifyConnected()) {
         resetNowPlayingUi("Connect Spotify to load current song data.");
         return null;
       }

       if (isNowPlayingRequestInFlight || document.hidden) {
         return null;
       }

       isNowPlayingRequestInFlight = true;

       try {
       const response = await spotifyFetch("/me/player/currently-playing");

         if (response.status === 429) {
           const retryAfterSeconds = getRetryAfterSeconds(response);
           scheduleSpotifyCooldown(retryAfterSeconds, () => {
             if (isSpotifyConnected()) {
               startNowPlayingPolling();
             }
           });
           return null;
         }

         if (response.status === 204) {
           resetNowPlayingUi();
           return null;
         }

         if (!response.ok) {
           throw new Error("Could not load current Spotify playback.");
         }

         const trackData = await response.json();
         console.log("Spotify currently playing JSON:", trackData);
         renderNowPlaying(trackData);
         return trackData;
       } finally {
         isNowPlayingRequestInFlight = false;
       }
     }

     function startNowPlayingPolling() {
       if (nowPlayingPollId) {
         window.clearInterval(nowPlayingPollId);
       }

       loadCurrentlyPlaying().catch((error) => {
         console.error(error);
         setAuthStatus(error.message);
       });

       nowPlayingPollId = window.setInterval(() => {
         loadCurrentlyPlaying().catch((error) => {
           console.error(error);
           setAuthStatus(error.message);
         });
       }, 10000);
     }

     function stopNowPlayingPolling() {
       if (nowPlayingPollId) {
         window.clearInterval(nowPlayingPollId);
         nowPlayingPollId = null;
       }
     }


     function loadSavedClientId() {
       const savedClientId = window.localStorage.getItem("spotify_client_id");
       if (!savedClientId) {
         return "";
       }


       window.__APP_CONFIG__ = {
         ...window.__APP_CONFIG__,
         spotifyClientId: savedClientId,
       };
       return savedClientId;
     }


     function saveClientId() {
       const clientId = clientIdInput?.value.trim() ?? "";
       if (!clientId) {
         setAuthStatus("Enter a Spotify Client ID before saving.");
         return false;
       }


       window.localStorage.setItem("spotify_client_id", clientId);
       window.__APP_CONFIG__ = {
         ...window.__APP_CONFIG__,
         spotifyClientId: clientId,
       };
       setAuthStatus("Spotify Client ID saved locally for this browser.");
       return true;
     }


     function updateAuthUi(profile) {
       if (profile) {
         setLoginButtonLabel("Disconnect Spotify");
         setAuthStatus(`Connected as ${profile.display_name ?? "Spotify user"}.`);
         window.dispatchEvent(
           new CustomEvent("spotify-auth-changed", {
             detail: {
               connected: true,
               profile,
             },
           })
         );
         return;
       }


       if (isSpotifyConnected()) {
         setLoginButtonLabel("Disconnect Spotify");
         setAuthStatus("Spotify connected. Ready to fetch your listening data.");
         window.dispatchEvent(
           new CustomEvent("spotify-auth-changed", {
             detail: {
               connected: true,
               profile: null,
             },
           })
         );
         return;
       }


       setLoginButtonLabel("Connect Your Spotify");
       setAuthStatus("Connect Spotify to load your listening data.");
       window.dispatchEvent(
         new CustomEvent("spotify-auth-changed", {
           detail: {
             connected: false,
             profile: null,
           },
         })
       );
     }


     async function initializeSpotifyAuth() {
       try {
         await handleSpotifyCallback();

         if (isSpotifyConnected()) {
           updateAuthUi(null);
           clearSpotifyCooldown();
           startNowPlayingPolling();

	           try {
	             const profile = await fetchCurrentUserProfile();
	             updateAuthUi(profile);
	             hideRateLimitWarning();
	           } catch (profileError) {
	             if (profileError.retryAfterSeconds) {
	               setAuthStatus(
	                 `Spotify connected. Profile lookup is cooling down for ${profileError.retryAfterSeconds} second${profileError.retryAfterSeconds === 1 ? "" : "s"}.`
               );
               return;
             }

             throw profileError;
           }
         } else {
           updateAuthUi(null);
           resetNowPlayingUi("Connect Spotify to load current song data.");
         }
       } catch (error) {
         console.error(error);
         setAuthStatus(error.message);
         setLoginButtonLabel("Connect Your Spotify");
         resetNowPlayingUi("Current song data could not be loaded.");
       }
     }


     loginButton?.addEventListener("click", async () => {
       if (isSpotifyConnected()) {
         stopNowPlayingPolling();
         clearSpotifyCooldown();
         logoutSpotify();
         updateAuthUi(null);
         resetNowPlayingUi("Connect Spotify to load current song data.");
         return;
       }


       setAuthStatus("Redirecting to Spotify...");


       try {
         if (!saveClientId()) {
           return;
         }

         await startSpotifyLogin();
       } catch (error) {
         console.error(error);
         setAuthStatus(error.message);
       }
     });


     saveClientIdButton?.addEventListener("click", () => {
       saveClientId();
     });


	     disconnectButton?.addEventListener("click", () => {
	       stopNowPlayingPolling();
	       clearSpotifyCooldown();
	       hideRateLimitWarning();
	       logoutSpotify();
	       updateAuthUi(null);
	     });


     if (clientIdInput) {
       clientIdInput.value = loadSavedClientId();
     }

	     document.addEventListener("visibilitychange", () => {
	       if (!isSpotifyConnected()) {
	         return;
       }

       if (document.hidden) {
         stopNowPlayingPolling();
         return;
       }

	       if (!spotifyCooldownTimeoutId) {
	         startNowPlayingPolling();
	       }
	     });

	     window.addEventListener("sortify-rate-limit", (event) => {
	       const retryAfterSeconds = event.detail?.retryAfterSeconds;
	       const path = event.detail?.path ?? "Spotify API";
	       showRateLimitWarning(
	         `${path} returned 429. Stop testing in other tabs.${retryAfterSeconds ? ` Retry after about ${retryAfterSeconds} second${retryAfterSeconds === 1 ? "" : "s"}.` : ""}`
	       );
	     });

	     initializeSpotifyAuth();
	   </script>
 </body>
</html>
